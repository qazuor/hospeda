<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hospeda — Test Fixture</title>
    <!-- Astro-emitted inline style (scoped CSS extracted from .astro components) -->
    <style>:where(html){font-family:var(--font-sans)}</style>
    <!-- Vite dev-id style block (dev mode flavor) -->
    <style data-vite-dev-id="/src/components/Header.astro?astro&type=style&index=0&lang.css">.header{display:flex}</style>
    <!-- Duplicate of the first style: two instances of one component. The two
         must collapse to a SINGLE hash source in the policy. -->
    <style>:where(html){font-family:var(--font-sans)}</style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica">
</head>
<body>
    <h1>Hospeda</h1>
    <p>Some content with a "<style>foo</style>" literal in a sentence (HTML-escaped at runtime).</p>

    <!-- Inline script for FOUC prevention -->
    <script>
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
    </script>

    <!-- External script (Astro bundles). Covered by 'self', NOT by a hash:
         CSP can only hash-match an external script that carries `integrity`. -->
    <script src="/_astro/client.hash.js" type="module"></script>

    <!-- Astro ClientRouter view-transitions script -->
    <script type="module" src="/_astro/ClientRouter.astro_astro_type_script_index_0_lang.hash.js"></script>

    <!-- Non-executable data block. Nothing in the app ships one today (the i18n
         dictionary moved to a hashed asset in HOS-369 Wave D), but the collector
         must keep handling the shape — hashed anyway, see collect-csp-hashes.ts. -->
    <script id="page-data" type="application/json">{"locale":"es","m":{"a":"b"}}</script>

    <!-- A tag still carrying a stray nonce attribute. The hash is computed over
         CONTENT only, so the attribute must not change the digest. -->
    <script nonce="stray-nonce">console.log('attributes do not affect the hash')</script>

    <!-- Script with a body that CONTAINS a literal <style>...</style> string —
         parse5 must not be tricked into hashing the inner literal as a style -->
    <script>
        const banner = "<style>this is text inside a script body</style>";
    </script>

    <!-- Empty script: nothing to execute, nothing to hash -->
    <script></script>

    <!-- noscript: nothing inside here may be hashed -->
    <noscript>
        <style>.no-js .hide{display:none}</style>
        <script>this content runs only when JS is disabled — should NOT be hashed</script>
    </noscript>

    <!-- Another plain script at the bottom -->
    <script>document.body.classList.add('ready')</script>
</body>
</html>
