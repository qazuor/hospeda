packages:
  - "apps/*"
  - "packages/*"
  - "infra/cloudflare/*"

publicHoistPattern:
  - "react"
  - "react-dom"
  - "*react*"

overrides:
  # ---------------------------------------------------------------------------
  # NO qzpay override lives here any more (removed 2026-08-21). Read this before
  # adding one back, and before bumping any single qzpay package on its own.
  #
  # WHY IT IS GONE. The five qzpay siblings (-core, -mercadopago, -drizzle,
  # -hono, -react) do not depend on core through a RANGE — every sibling release
  # pins core to an EXACT version, and each core release is shipped with a
  # matching republish of all five:
  #
  #     hono@1.6.8 -> core 3.0.0      hono@1.6.9 -> core 3.1.0
  #     react@1.1.23 -> core 3.0.0    react@1.1.24 -> core 3.1.0
  #     drizzle@1.12.0 -> core 3.1.0  mercadopago@2.9.0 -> core 3.1.0
  #
  # So when all five sit on the same release wave they already demand the same
  # exact core and converge on their own — verified: dropping the override moved
  # zero `version:` lines in pnpm-lock.yaml, only the `specifier:` fields the
  # override had been rewriting. The override was doing nothing except hiding
  # whether that convergence was real.
  #
  # WHAT IT WAS HIDING. Because the pin is exact, a sibling left behind on an
  # older wave does not fail to resolve — it silently RECEIVES the forced core
  # and typechecks against an interface it does not implement. Measured on
  # 2026-08-20: drizzle@1.11.8 asked for core 3.0.0, got 3.1.0, and core 3.1.0
  # declares `findActiveByProviderResourceId`, which that drizzle has no
  # implementation for. It compiled purely because nothing called it yet.
  #
  # WHAT WOULD BREAK THIS. Bumping ONE qzpay package (or letting Dependabot do
  # it) puts two exact core demands in the tree and splits `QZPayBilling` into
  # two type identities again — the original HOS-232 failure. The five move
  # together, as one changeset, or not at all. Re-adding an override would only
  # re-hide the split: fix the lagging sibling instead.
  #
  # ---------------------------------------------------------------------------
  # HISTORY — the versions this convergence must never fall below. Each entry is
  # a real production incident; a downgrade re-opens it.
  #
  # HOS-232: unify qzpay-core / -mercadopago to a single version across the
  # workspace. qzpay-hono/-drizzle transitively pinned older core versions
  # (1.12.0 / 1.16.0), and having two `QZPayBilling`/`QZPayEventMap` type
  # identities in play makes a 1.17.0 billing instance unassignable to a 1.12.0
  # parameter (the `subscription.uncanceled` event is only in 1.17.0). This is
  # the constraint the whole scheme exists to satisfy.
  #
  # H-146 (2026-08-15): raised to core 2.0.0. Until 1.17.0, `billing.payments.refund()`
  # wrote status:'refunded' to storage WITHOUT ever calling the provider adapter, so a
  # local row claimed money went back while nothing left the MercadoPago account (two
  # production rows, 1.800.000 + 1.500.000 centavos). 2.0.0 calls the provider first and
  # mirrors its verdict. Major because refund can now throw where it always resolved.
  # FLOOR: core >= 2.0.0.
  #
  # Raised to core 3.0.0 the same day: `customers.update()` and `customers.delete()`
  # were also storage-only while `adapter.customers.update/delete` sat unused, so the
  # MercadoPago customer kept a stale email and survived a local deletion WITH its
  # saved cards. 3.0.0 mirrors both to the provider. Major because `delete()` is now
  # destructive at MercadoPago and not reversible: `handleUserDeletion` in
  # `billing-customer-sync.ts` removes the stored payment instruments from this
  # version on. FLOOR: core >= 3.0.0.
  #
  # HOS-704 (2026-08-20): raised to core 3.1.0 / mercadopago 2.9.0. The mapped
  # `QZPayProviderPayment` carried no refunded amount, so a MercadoPago payment
  # refunded by 30% and one refunded in full were indistinguishable downstream —
  # and the destructive reading ("assume total") is the one the webhook took,
  # cancelling the subscription of a customer who got part of their money back.
  # 2.9.0 maps MP's `transaction_amount_refunded` onto a new optional
  # `refundedAmount` (minor units, like `amount`); 3.1.0 is the core interface
  # that declares it. Additive minors on both.
  # FLOOR: core >= 3.1.0, mercadopago >= 2.9.0. Dropping below either one makes a
  # partial refund cancel the customer's subscription again.
  #
  # HOS-710 (2026-08-20): the same core 3.1.0 carries a second, independent fix,
  # so that floor is load-bearing for two reasons and neither may be reverted
  # alone. 3.1.0 also adds `findActiveByProviderResourceId` to the polling-job
  # storage port and rescopes the active-job unique index from `subscription_id`
  # to `(provider, provider_resource_id)`. The old scope allowed one active
  # polling job per SUBSCRIPTION, so the first add-on checkout — even an
  # abandoned one — held the only slot and every later purchase got no job at
  # all. MP Preferences deliver no Webhooks v2 event, so that job is the only
  # activation path a purchase has: two approved payments were collected and
  # never recorded. Ships with migration 0093 on our side. FLOOR: core >= 3.1.0.
  #
  # 2026-09-01: the split above happened AGAIN, and this time nothing failed.
  # `pnpm-lock.yaml` held two core versions — 5.1.0, declared directly by the
  # five workspace packages after core was raised on its own to pick up
  # `payerEmail` (HOS-937), and 5.0.0, still pinned by drizzle 2.0.0, hono
  # 1.6.11, react 1.1.26 and mercadopago 2.9.2. npm already had all four
  # republished against the new core; nobody had installed them. The tell was in
  # this very file: `minimumReleaseAgeExclude` listed `qzpay-core@5.1.0` while
  # every sibling line stopped one version short.
  #
  # It was benign — 5.1.0 adds one optional field, so both `QZPayBilling`
  # identities were structurally compatible, `tsc` passed on api, admin and web,
  # and the billing suites were green. That is the part worth remembering:
  # HOS-232 is not detected by a red build. It is detected by COUNTING.
  #
  #     grep "'@qazuor/qzpay-core@" pnpm-lock.yaml   # must print ONE line
  #
  # Which is now a guard rather than a habit —
  # `scripts/check-qzpay-wave-convergence.sh`, wired into both `check:guards`
  # and its own CI step. It proves one core version resolves, not WHICH one; the
  # floors above stay prose, and are not machine-checked.
  #
  # HOS-1233 (2026-09-08): raised to core 6.0.0. `productDomain` is now REQUIRED
  # on subscription creation — a major because omitting it stops compiling.
  # Until then the parameter did not exist at all, so every row Hospeda created
  # through `createPaidSubscription` was born on `billing_subscriptions`'s own
  # `'accommodation'` column default. Measured in prod AND staging: every
  # `tourist-*` plan, and every subscription on one, reported `accommodation`.
  # Not one line of code was wrong; the value was simply never stated. The floor
  # is what keeps it stateable. FLOOR: core >= 6.0.0.
  #
  # Current wave (2026-09-08): core 6.0.0 · mercadopago 2.11.1 · drizzle 3.0.0 ·
  # hono 2.0.0 · react 2.0.0. Declared as `^` ranges in apps/api, apps/admin,
  # packages/billing, packages/db and packages/service-core.
  #
  # This line was stale for two waves before anyone noticed (it still named the
  # 2026-09-01 wave while the workspace had moved twice). It is prose, so no
  # guard reads it — `check-qzpay-wave-convergence.sh` proves ONE core resolves,
  # never which one. Update it in the same commit that moves the ranges.
  #
  # WHAT KEEPS THE WAVE TOGETHER. The rule above is about two DIFFERENT exact
  # core demands coexisting, which is narrower than "never bump one package".
  # qzpay's siblings depend on core as `workspace:*`, and changesets rewrites
  # that to the exact published core at release time. So a changeset that bumps
  # CORE makes changesets republish every sibling that pins it, and the wave
  # re-converges on its own — that is the mechanism, not a ritual someone has to
  # remember.
  #
  # This wave is an example of it. HOS-993 needed three additive columns in
  # drizzle and touched no core at all; it landed in the same release as
  # HOS-987's core patch, and the core bump alone republished the other four.
  # Had it shipped by itself, drizzle would have inherited the same exact core
  # the others already pinned and nothing would have split either — a sibling
  # release that does not touch core is safe on its own.
  #
  # What must never happen is picking up one sibling from a NEWER wave while the
  # rest stay behind — that is the HOS-232 split, and it is a lockfile decision
  # here, not something qzpay can prevent.
  # ---------------------------------------------------------------------------
  typescript: "6.0.3"
  "zod@>=4.0.0 <5": "4.3.6"
  ws: ">=8.21.0"
  form-data: ">=4.0.6"
  protobufjs: ">=7.6.1"
  react: "19.2.7"
  react-dom: "19.2.7"
  vitest: "4.1.10"
  "@vitest/coverage-v8": "4.1.10"
  "@vitest/ui": "4.1.9"
  # 3.1.2 is vulnerable to both host-confusion advisories (failed IDN
  # canonicalization and literal backslash); 3.1.4 patched those two.
  # GHSA-7p8r-x3mc-p8w7 (high) then landed on 3.1.4 itself, so this exact pin
  # became the thing installing the vulnerable version — same failure mode as
  # brace-expansion and js-yaml below. An exact pin cannot absorb a follow-up
  # advisory, so this is now a floor rather than a pin.
  #
  # Scoped to the 3.x line on purpose. The advisory range is ">=3.0.0 <3.1.5",
  # so 3.1.5 clears it — a bare ">=3.1.5" additionally resolved the tree onto
  # 4.1.2, forcing a semver major onto ajv@8.20.0 (the only consumer), which
  # declares the 3.x line. Fixing an advisory must not smuggle in a major.
  "fast-uri@>=3.0.0 <4": ">=3.1.5 <4"
  devalue: ">=5.8.1"
  seroval: ">=1.4.1"
  tar: ">=7.5.11"
  tar-fs: ">=3.1.1"
  node-forge: ">=1.4.0"
  basic-ftp: ">=5.2.0"
  cookie: ">=0.7.0 <2"
  path-to-regexp: ">=6.3.0"
  "msw>path-to-regexp": "8.4.2"
  rollup: ">=4.59.0"
  qs: ">=6.14.2"
  "@isaacs/brace-expansion": ">=5.0.1"
  # GHSA-rgw5-rvv9-x895 (2026-08-03): <5.0.9 is vulnerable, and the previous
  # ">=5.0.8" floor here was itself resolving the tree onto the vulnerable
  # 5.0.8. Transitive only (glob > minimatch > brace-expansion), so raising
  # this floor is the only reachable fix.
  brace-expansion: ">=5.0.9"
  shell-quote: ">=1.8.5"
  mdast-util-to-hast: ">=13.2.1"
  preact: ">=10.26.10"
  h3: ">=1.15.6"
  "nitro>h3": "2.0.1-rc.22"
  minimatch: ">=9.0.7"
  # GHSA-73wf-gq98-2v4g + companion (2026-09-01): 4.28.6 has unbounded memory
  # growth on a cache miss and a prototype write reachable from a crafted
  # query. Transitive only, reached ~100 ways through
  # @tanstack/react-start > @babel/core > @babel/helper-compilation-targets,
  # so raising the floor here is the only fix until that tree republishes.
  browserslist: ">=4.28.8"
  lodash: ">=4.17.24"
  lodash-es: ">=4.17.24"
  serialize-javascript: ">=7.0.3"
  prismjs: ">=1.30.0"
  # GHSA-5p4m-2wfm-xmqj (2026-08-06, high): the !!omap quadratic-CPU DoS covers
  # >=4.0.0 <4.3.1, and the previous "<4.1.1" selector here was itself resolving
  # the tree onto 4.3.0 — inside the new vulnerable range. Same failure mode as
  # brace-expansion above: the floor was the thing installing the vulnerable
  # version. Raising the selector to the full advisory range is the fix.
  # Transitive only (xmlbuilder2, @tanstack/start-plugin-core, ~100 paths), so
  # an override is the only reachable route — Dependabot cannot patch these.
  #
  # AMPLIADO otra vez el 2026-09-08 por GHSA-2883-xcg3-v3hh (high):
  # `maxTotalMergeKeys` no acota el CPU cuando las fuentes del merge están
  # vacías, y el rango vulnerable llega hasta <4.3.2. El piso anterior (4.3.1)
  # volvió a ser exactamente la versión que el advisory nombra — tercera vez que
  # este override se queda corto por la misma razón, así que vale escribirla:
  # cuando el rango de un advisory se amplía, el piso que lo cerraba pasa a ser
  # el techo de lo vulnerable. Además de xmlbuilder2, ahora también entra por
  # apps/api > @better-auth/expo > expo > @expo/cli > @expo/xcpretty.
  "js-yaml@<4.3.2": "^4.3.2"
  # The 5.x line is a separate advisory track from the 4.x pin above: 5.2.0 is
  # installed and is hit by both the flow-collection and the !!omap DoS. Already
  # above the !!omap fix, so this line needed no change.
  "js-yaml@>=5.0.0": ">=5.2.2"
  # Lote de advisories del 2026-09-08 (~10 GHSAs high sobre las dos líneas vivas:
  # GHSA-6mj3-qw4j-hgrw, -c7q8-3ch8-vqpv, -27p8-2357-5qqv, -8344-3jmq-59r6,
  # -965w-775f-mr7g, -93r5-fhx6-vmg9, -3px3-54cx-rmw9, -vr34-hp96-76pp,
  # -w2rr-34g9-rvrj, -4w3w-2rp5-g8jm). Amplificación de salida y mismatches de
  # parseo en XML/HTML.
  #
  # Las DOS líneas se pinean por separado a propósito: `@expo/plist` declara
  # `^0.8.8` y `@expo/config-plugins` la 0.9.x, así que un solo override con
  # `>=0.9.12` cruzaría a un consumidor de la 0.8 por encima de un major.
  #
  # Transitivo puro y por un solo camino: apps/api > @better-auth/expo > expo >
  # @expo/cli > (@expo/plist | @expo/config-plugins > xcode > simple-plist >
  # plist). Ese sub-árbol es herramental de prebuild de iOS/Android — la API
  # Hono no lo ejecuta nunca; lo que sí se usa de `@better-auth/expo` es el
  # plugin `expo()` de apps/api/src/lib/auth.ts, que es server-side puro (un
  # endpoint de deep-link y un hook sobre `origin`) y no toca XML. Por eso el
  # riesgo de forzar estas versiones es bajo, pero el advisory se cierra igual.
  "@xmldom/xmldom@<0.9.0": ">=0.8.15 <0.9.0"
  "@xmldom/xmldom@>=0.9.0": ">=0.9.12"
  # 0.0.33 and 0.1.0 both reach the arbitrary-write and path-traversal
  # advisories. Only reachable through external-editor (CLI prompt tooling).
  tmp: ">=0.2.6"
  # 2.7.1 is installed alongside an already-patched 2.9.0; scope the bump to the
  # 2.x line so a hypothetical 1.x consumer is not force-upgraded across a major.
  "yaml@>=2.0.0 <2.8.3": ">=2.8.3"
  # 1.20.5 -> 1.20.6 is a patch within the 1.x line. Bounded below 2 so an
  # express 5 consumer keeps resolving its own 2.x.
  "body-parser@<2": ">=1.20.6 <2"
  # GHSA (2026-08-03): <8.9.0 is hit by a cross-user information disclosure. The
  # floor was already ours, so Dependabot bumping the lock alone (#2584) does not
  # close it — the range still ALLOWS 8.7.0 for transitive paths. Raise the floor.
  # Stays bounded below 9: the h2-by-default concern that gated adopting 8.x was
  # settled on that major, and this is a minor within it.
  undici: ">=8.9.0 <9"
  "vite@^6.0.0": ">=8.0.16 <9"
  "vite@^7.0.0": ">=8.0.16 <9"
  "vite@>=6.0.0": ">=8.0.16 <9"
  "@sentry/vite-plugin": ">=5.3.0"
  # GHSA-2v37-7h3g-55p8 (advisory ampliado 2026-08-07, y otra vez 2026-08-15):
  # el generador custom puede colgarse en un loop infinito con size 0. Sólo la
  # línea 3.x está afectada; las 5.x y 6.x del árbol quedan fuera del rango.
  # Acotado bajo 4 para no arrastrar a ningún consumidor de la 3.x a través de
  # un major. Transitivo puro (vite > postcss > nanoid, ~100 paths), así que
  # Dependabot no lo alcanza.
  #
  # El rango del advisory pasó a "<3.3.18", así que el piso anterior (3.3.17)
  # era EL QUE INSTALABA la versión vulnerable — mismo modo de falla que
  # brace-expansion, js-yaml y fast-uri más arriba. Un piso no absorbe un
  # advisory posterior por sí solo: hay que subirlo cada vez que se amplía.
  "nanoid@<3.3.18": ">=3.3.18 <4"
  markdown-it: ">=14.1.1"
  diff: ">=8.0.3"
  defu: ">=6.1.5"
  flatted: ">=3.4.2"
  picomatch: ">=2.3.2"
  "picomatch@^4.0.0": ">=4.0.4"
  # GHSA-fxqj-rqcc-2cmp (<=8.5.22). #2757 bumped the direct dependency to
  # 8.5.26, which did NOT close the advisory: tsup > postcss-load-config still
  # resolves 8.5.20. A direct bump never reaches a transitive path, so the
  # alert stayed open behind a merged "fix". Bounded below 9 so a future
  # postcss 9 consumer is not dragged across a major.
  "postcss@<8.5.23": ">=8.5.23 <9"
  kysely: ">=0.28.17"
  # Three advisories land on the installed 10.2.0: GHSA-mwp4-54f8-5fhr (high,
  # patched 10.3.1) plus GHSA-22jq-vg5j-6vgg (10.2.1) and GHSA-4xrf-jv44-h6hh
  # (10.2.2). 10.3.1 is the only floor that clears all three. Transitive only
  # (socks-proxy-agent), so no Dependabot PR can ever reach it — an override is
  # the only route.
  ip-address: ">=10.3.1"
  svgo: ">=4.0.1"
  next: ">=16.2.3"
  drizzle-orm: ">=0.45.2"
  "@opentelemetry/api": "1.9.1"
  "@remix-run/node": ">=2.17.2"
  # GHSA-2j2x-hqr9-3h42: the previous ">=1.23.2" floor was resolving the tree
  # onto 1.23.2, which the advisory covers. Raised to the patched 1.23.3.
  "@remix-run/router": ">=1.23.3"
  "@remix-run/server-runtime": ">=2.17.5"
  esbuild: ">=0.28.1"
  "@tanstack/form-core": "0.42.1"
  csstype: "3.1.3"
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
  "@vitejs/plugin-react": "^6.0.3"
  turbo-stream: ">=3.0.0"
  linkify-it: ">=5.0.2 <6"
  sharp: ">=0.35.3 <0.36"
  fast-xml-parser: ">=5.10.1 <6"

auditConfig:
  ignoreGhsas:
    - GHSA-rmmr-r34h-pfm5
    - GHSA-5xrq-8626-4rwp
    # image-size: DoS en los parsers de ICNS (GHSA-w3rx-r6r6-pgpr) y de JXL/HEIF
    # (GHSA-5p2g-fcmc-qvqq). Ignorados porque NO HAY PARCHE: el advisory declara
    # `>=2.0.3` como versión corregida y esa versión no existe — 2.0.2, el último
    # release publicado (abril 2025), es el vulnerable. No hay override posible.
    #
    # RIESGO ACEPTADO, NO INEXISTENTE. `packages/media/src/server/validate-media-file.ts`
    # llama `imageSize()` sobre el buffer que sube el usuario, e `image/heic` está
    # en `ENTITY_MIME_TYPES`, así que el vector HEIF es alcanzable: la allowlist de
    # MIME y el chequeo de magic bytes corren ANTES, y un HEIF bien formado los pasa
    # a los dos. ICNS y JXL no están en la allowlist, así que ese vector sí está
    # cerrado. Decisión del owner (2026-08-07) para no romperle la subida a los
    # usuarios de iPhone, que mandan HEIC por defecto.
    #
    # REVISAR: HOS-418 sigue el arreglo real (migrar la medición de dimensiones a
    # `sharp`, que ya está en el árbol y usa libvips en vez del parser JS) y el
    # release de image-size 2.0.3 cuando salga. Sacar estas dos líneas al cerrarlo.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

allowBuilds:
  # Needed to upload source maps to Sentry from @sentry/esbuild-plugin (api)
  # and @sentry/vite-plugin (web, admin) at build time.
  '@sentry/cli': true
  # Native CPU profiler; hospeda-api depends on @sentry/profiling-node
  # directly (dependencies, not transitive) for Sentry performance profiling.
  '@sentry/node-cpu-profiler': true
  # Pulled in by posthog-js. Its postinstall only prints an OpenCollective
  # donation message — no build/codegen step is required for it to work.
  core-js: false
  # Downloads the platform-specific esbuild binary; required transitively by
  # astro, tsup and drizzle-kit builds across every app.
  esbuild: true
  # Native accelerator for msgpackr, used by bullmq (job queues backing the
  # billing crons: dunning, webhook-retry, etc. — see apps/api/src/cron/jobs).
  msgpackr-extract: true
  # Repo only uses msw/node's setupServer for test mocking (no setupWorker /
  # msw/browser usage found) — the postinstall only writes a browser service
  # worker file that nothing here consumes.
  msw: false
  # Direct dependency of hospeda-web (image optimization) and a root
  # devDependency; needs its native libvips binary to function.
  sharp: true

# pnpm >=10 changed `pnpm deploy` to require inject-workspace-packages=true.
# The web and api Dockerfiles use `pnpm deploy --filter=X --prod` in their prune
# stage; keep the pre-v10 deploy behavior instead of switching the whole
# workspace to injected packages (which would change @repo/* resolution in dev too).
forceLegacyDeploy: true

minimumReleaseAgeExclude:
  # UNION of both waves, not a choice between them (merge of `staging`,
  # 2026-09-09). `staging` had converged on core 5.3.0 while this branch was on
  # 6.0.0; the installed wave is 6.0.0 (a strict descendant — qzpay PR #83's
  # payer-email fix released as 5.3.0, PR #85's required productDomain as
  # 6.0.0), but the older entries stay listed. This is an allowlist of versions
  # permitted past the minimum-release-age policy, so dropping the side that
  # lost the version race removes a permission another branch may still need
  # and buys nothing.
  - '@qazuor/qzpay-core@1.15.0 || 1.16.0 || 1.17.0 || 2.0.0 || 3.0.0 || 3.1.0 || 4.0.0 || 5.0.0 || 5.1.0 || 5.1.1 || 5.2.0 || 5.3.0 || 6.0.0'
  - '@qazuor/qzpay-mercadopago@2.6.0 || 2.7.0 || 2.8.0 || 2.8.1 || 2.8.2 || 2.9.0 || 2.9.1 || 2.9.2 || 2.9.4 || 2.10.0 || 2.11.0 || 2.11.1'
  - '@qazuor/qzpay-drizzle@1.11.5 || 1.11.7 || 1.11.8 || 1.12.0 || 1.13.0 || 2.0.0 || 2.1.0 || 2.1.1 || 2.1.2 || 3.0.0'
  - '@qazuor/qzpay-hono@1.6.7 || 1.6.8 || 1.6.9 || 1.6.10 || 1.6.11 || 1.6.13 || 1.6.14 || 1.6.15 || 2.0.0'
  - '@qazuor/qzpay-react@1.1.22 || 1.1.23 || 1.1.24 || 1.1.25 || 1.1.26 || 1.1.28 || 1.1.29 || 1.1.30 || 2.0.0'
